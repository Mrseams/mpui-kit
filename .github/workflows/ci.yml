name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Turborepo runs these per workspace (core, ui, docs).
      - name: Typecheck and test
        run: pnpm turbo run typecheck test

      - name: Check registry
        run: pnpm registry:check

      # Builds @mpui-kit/core, then the registry, then the docs site.
      - name: Build
        run: pnpm build

      - name: Check core package
        run: pnpm core:check

      - name: Check bundle size
        run: pnpm size
